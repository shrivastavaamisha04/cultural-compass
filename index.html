
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Cultural Compass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #FAF9F6;
            color: #1e293b;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #FAF9F6;
            background-image: 
                radial-gradient(at 15% 15%, hsla(225, 100%, 94%, 1) 0px, transparent 50%),
                radial-gradient(at 85% 15%, hsla(280, 100%, 94%, 1) 0px, transparent 50%),
                radial-gradient(at 50% 50%, hsla(190, 100%, 95%, 1) 0px, transparent 50%),
                radial-gradient(at 15% 85%, hsla(35, 100%, 93%, 1) 0px, transparent 50%),
                radial-gradient(at 85% 85%, hsla(340, 100%, 94%, 1) 0px, transparent 50%);
            filter: blur(60px);
            opacity: 0.8;
            transform: scale(1.2);
        }
        .glass-container {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 2rem;
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.05);
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 8s linear infinite;
        }
    </style>
<script type="importmap">

  }
}
</script>

</head>

</html>
